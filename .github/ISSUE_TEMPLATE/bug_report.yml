name: Ошибка в ABarz
description: Падение, неправильная работа или проблема с установкой
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: |
        Опиши, что произошло — это поможет воспроизвести проблему.
        Не прикладывай файл cloudflare-device.json: в нём персональный ключ устройства.
  - type: dropdown
    id: build
    attributes:
      label: Сборка
      options:
        - autoabarz.lua — с обновлением
        - abarz1.5.lua — без обновления
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия скрипта
      placeholder: Номер версии из меню ABarz
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Игровой сервер
      placeholder: Например, №18 Casa Grande или Vice City
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Что делал перед ошибкой?
      description: Перечисли действия и напиши, что ожидал увидеть и что получилось.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Текст ошибки из moonloader.log
      description: Если скрипт упал, скопируй ошибку со строкой stack traceback.
      render: text
